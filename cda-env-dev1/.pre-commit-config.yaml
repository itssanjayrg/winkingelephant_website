repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform-fmt
        entry: terraform fmt -recursive -write=true
        args: [ "." ]
        language: system
        types: [ ]
        pass_filenames: false
  - repo: https://github.com/psf/black
    rev: '23.3.0'
    hooks:
      - id: black
  - repo: https://github.com/kynan/nbstripout
    rev: '0.6.1'
    hooks:
      - id: nbstripout
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: name-tests-test
